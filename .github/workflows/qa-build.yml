name: Mobile QA build

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa-debug:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Build debug app with QA endpoints
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon \
            -PapiBaseUrl=http://10.0.2.2:18080/ \
            -PiaBaseUrl=http://10.0.2.2:18000/
      - name: Upload QA APK
        uses: actions/upload-artifact@v4
        with:
          name: mottainai-mobile-operacional-qa-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 3
